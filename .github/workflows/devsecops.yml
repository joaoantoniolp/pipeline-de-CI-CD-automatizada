name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Secret scanning -> falha se achar segredo
  secrets:
    name: 1 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) SAST -> falha em qualquer achado das regras selecionadas
  sast:
    name: 2 - SAST (Semgrep)
    runs-on: ubuntu-latest
    container: {image: semgrep/semgrep:latest}
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (security gate)
        run: >
          semgrep scan --config p/python --config p/owasp-top-ten
          --config p/security-audit --error .

  # 3) SCA + SBOM
  sca-sbom:
    name: 3 - SCA e SBOM (Trivy + Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar SBOM CycloneDX (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
      - name: SCA - CVEs nas dependencias (security gate HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD":/work -w /work ghcr.io/aquasecurity/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  # 4) Docker + IaC
  iac-docker:
    name: 4 - Dockerfile e IaC (Hadolint, Checkov, Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Checkov (Dockerfile + Kubernetes)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,kubernetes
          skip_check: CKV_K8S_43   # exige digest da imagem; fora do escopo
          soft_fail: false
      - name: Trivy config (Dockerfile, Compose, K8s)
        run: |
          docker run --rm -v "$PWD":/work -w /work ghcr.io/aquasecurity/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 .

  # 5) Build + scan da imagem + DAST (so roda se os gates anteriores passarem)
  build-dast:
    name: 5 - Build, Trivy Image e DAST (ZAP)
    runs-on: ubuntu-latest
    needs: [secrets, sast, sca-sbom, iac-docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t devsecops-api:ci .
      - name: Scan da imagem (security gate HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed devsecops-api:ci
      - name: Subir container de staging
        run: |
          docker run -d --name api -p 8000:8000 -e API_KEY="$(openssl rand -hex 16)" devsecops-api:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break || sleep 2; done
      - name: DAST - OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
